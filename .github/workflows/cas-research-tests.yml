name: CAS Research Tests

on:
  pull_request:
    paths:
      - 'backend/screener/cas_*.py'
      - 'backend/screener/tests/test_cas_*.py'
      - 'backend/fno_sniper/**'
      - 'backend/requirements*.txt'
      - 'backend/requirements/**'
      - '.github/workflows/cas-research-tests.yml'
  push:
    branches:
      - cas-radar

jobs:
  test-cas-research:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements/*.txt

      - name: Install dependencies
        shell: bash
        run: |
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -d requirements ]; then for f in requirements/*.txt; do [ -f "$f" ] && pip install -r "$f"; done; fi

      - name: Django system check
        run: python manage.py check

      - name: CAS research tests
        run: python manage.py test screener.tests.test_cas_radar screener.tests.test_cas_research -v 2
